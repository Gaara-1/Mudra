  @keyframes dashFlow{to{stroke-dashoffset:-46;}}

/* ---------------- Smart Scan: mixed files + camera + automatic type detection ---------------- */
function detectDocumentType(rawText, fileName = "") {
  const text = (rawText || "").toUpperCase().replace(/[^A-Z0-9\s]/g, " ");
  const words = text.match(/[A-Z]{3,}/g) || [];
  const filename = (fileName || "").toUpperCase();
  const candidates = DOC_TYPES.filter((d) => d.id !== "other").map((doc) => {
    const rule = DOC_RULES[doc.id];
    let hits = 0;
    const matched = [];
    rule.concepts.forEach((concept) => {
      const exact = concept.accepted.find((term) => text.includes(term));
      const fuzzy = exact ? null : classifyConcept(words, concept);
      if (exact || (fuzzy && fuzzy.status !== "missing")) {
        hits += 1;
        matched.push(exact || fuzzy.found);
      }
    });
    let score = rule.concepts.length ? hits / rule.concepts.length : 0;
    if (rule.numberRegex && rule.numberRegex.test(text)) score += 0.45;
    if (filename.includes(doc.id.toUpperCase()) || filename.includes(doc.name.toUpperCase().split(" ")[0])) score += 0.25;
    return { doc, score, matched };
  }).sort((a, b) => b.score - a.score);
  const best = candidates[0];
  if (!best || best.score < 0.45) {
    return { doc: docById("other"), confidence: words.length > 3 ? 58 : 35, matched: [], review: true };
  }
  return {
    doc: best.doc,
    confidence: Math.min(98, Math.max(62, Math.round(48 + best.score * 42))),
    matched: best.matched.filter(Boolean),
    review: best.score < 0.9
  };
}

function loadImageForScan(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => resolve({ image, url });
    image.onerror = reject;
    image.src = url;
  });
}

async function scanFilePages(file, onProgress) {
  if (!window.Tesseract) throw new Error("OCR engine not loaded");
  const pages = [];
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    if (!window.pdfjsLib) throw new Error("PDF renderer not loaded");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    for (let index = 1; index <= pdf.numPages; index++) {
      const page = await pdf.getPage(index);
      const viewport = page.getViewport({ scale: 1.55 });
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      const { data } = await window.Tesseract.recognize(canvas, "eng", {
        logger: (message) => onProgress({ page: index, total: pdf.numPages, progress: message.progress || 0 })
      });
      pages.push({ page: index, pageCount: pdf.numPages, text: data.text, previewUrl: canvas.toDataURL("image/jpeg", 0.72) });
    }
    return pages;
  }
  const { image, url } = await loadImageForScan(file);
  const canvas = document.createElement("canvas");
  const scale = Math.min(1.8, 1800 / Math.max(image.naturalWidth, image.naturalHeight));
  canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
  canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
  const { data } = await window.Tesseract.recognize(canvas, "eng", {
    logger: (message) => onProgress({ page: 1, total: 1, progress: message.progress || 0 })
  });
  pages.push({ page: 1, pageCount: 1, text: data.text, previewUrl: url });
  return pages;
}

  return `demo-${(hash >>> 0).toString(16)}`;
}

      unlocked && h("div", { className: "mt-6 grid lg:grid-cols-2 gap-4 fade-in" },

        keyCard("cyber", "Cyber data", "Use for an authorized cyber-intelligence or case-data provider. Keep access scoped to the minimum required.", "Radar")
      )
    ),
    open && !unlocked && h("div", { className: "fixed inset-0 z-[100] bg-slate-950/45 backdrop-blur-sm flex items-center justify-center p-4" },
      h("div", { className: "zyid-modal-surface w-full max-w-sm rounded-3xl bg-white border border-slate-200 shadow-2xl p-6" },
        h("div", { className: "flex items-start gap-3 mb-5" }, h("div", { className: "w-11 h-11 rounded-2xl bg-slate-900 text-white flex items-center justify-center" }, h(Icon, { name: "Lock", size: 20 })), h("div", null, h("h3", { style: disp, className: "font-bold text-[#0B1220]" }, "Unlock Database"), h("p", { className: "text-xs text-slate-500 mt-1" }, "Enter the Database password to view connection fields."))),
        h("form", { onSubmit: unlock, className: "space-y-3" }, h("input", { type: "password", inputMode: "numeric", autoFocus: true, value: password, onChange: (event) => setPassword(event.target.value), placeholder: "Database password", className: "w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm text-[#0B1220] outline-none focus:border-[var(--acc-1)]" }), error && h("div", { className: "text-xs font-semibold text-rose-600" }, error), h("div", { className: "flex gap-2 pt-2" }, h("button", { type: "button", onClick: () => setOpen(false), className: "flex-1 rounded-xl border border-slate-200 py-2.5 text-sm font-semibold text-slate-600" }, "Cancel"), h("button", { type: "submit", className: "flex-1 rounded-xl bg-slate-900 py-2.5 text-sm font-bold text-white" }, "Unlock")))
      )
    )
  );
}

  return h("div", { className: "p-5 lg:p-8 relative z-10 space-y-6" },

      h("div", { className: "flex items-center gap-2 mb-2" }, h(Icon, { name: "Palette", size: 16, className: "accent-color" }), h("h2", { style: disp, className: "font-bold text-[#0B1220] text-lg" }, "Appearance")),
      h("p", { className: "text-sm text-slate-400 mb-5" }, "Choose a matte light or dark workspace for reports and scanner states."),
      h("div", { className: "grid sm:grid-cols-2 gap-3 mb-5" },
        [["light", "Light mode", "bg-white", "Sun"], ["dark", "Dark mode", "bg-black", "Moon"]].map(([mode, label, swatch, icon]) => h("button", { key: mode, type: "button", onClick: () => setThemeMode(mode), className: `text-left rounded-2xl border p-4 transition-all ${themeMode === mode ? "border-[var(--acc-1)] ring-2 ring-[var(--acc-1)]/20" : "border-white/10"}` },
          h("div", { className: `w-full h-10 rounded-xl ${swatch} mb-3 flex items-center justify-center` }, h(Icon, { name: icon, size: 17, className: mode === "dark" ? "text-white" : "text-slate-700" })), h("div", { className: "text-sm font-bold text-[#0B1220]" }, label), h("div", { className: "text-[11px] text-slate-500 mt-1" }, themeMode === mode ? "Currently selected" : "Use this appearance")
        ))
      ),
      h("div", { className: "mt-5 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-xs text-slate-500" }, "The workspace uses the fixed ZyID matte accent.")
    ),
    h(DatabaseVault, { pushToast }),
    h(Card, { className: "max-w-4xl mx-auto p-6 sm:p-8" },
      h("h2", { style: disp, className: "font-bold text-[#0B1220] text-lg mb-4" }, "Privacy & Security"),
      h("div", { className: "space-y-3" }, items.map((it) => h("div", { key: it, className: "flex items-center justify-between bg-white/5 rounded-xl px-4 py-3" }, h("span", { className: "text-sm text-slate-100" }, it), h("span", { className: "text-xs font-semibold text-emerald-400 inline-flex items-center gap-1" }, h(Icon, { name: "CheckCircle2", size: 13 }), " Enabled")))),
      h("p", { className: "text-[11px] text-slate-500 mt-5 leading-relaxed" }, "This is a demo build: encryption, storage, blockchain status and government integrations shown here are illustrative. Production API keys must never be stored in browser localStorage.")

function Landing({ onStart }) {
  return h("div", { className: "min-h-screen bg-[#05060a] flex items-center justify-center px-6 relative overflow-hidden" },
    h(EnergyBackground, { variant: "landing" }),
    h("div", { className: "relative z-10 text-center max-w-2xl fade-in" },
      h("div", { className: "relative w-24 h-24 mx-auto mb-6 flex items-center justify-center" },
        h("div", { className: "absolute inset-0 rounded-full border border-white/10 ring-spin" }),
        h("div", { className: "absolute inset-2 rounded-full border border-dashed border-white/10 ring-spin-rev" }),
        h("div", { className: "w-16 h-16 rounded-2xl logo-orb flex items-center justify-center accent-glow" }, h(Icon, { name: "ZyIDMark", size: 30, className: "accent-color" }))
      ),
      h("h1", { style: disp, className: "text-4xl sm:text-5xl font-extrabold tracking-tight text-[#0B1220]" }, "ZyID"),
      h("p", { className: "text-slate-300 text-sm mt-2 tracking-wide" }, "AI-Powered Identity & Document Fraud Detection"),
      h("div", { className: "flex flex-wrap justify-center gap-2 mt-6 text-xs text-slate-200" }, ["Verify documents", "Detect anomalies", "Identify suspicious patterns", "Support investigations"].map((t) => h("span", { key: t, className: "bg-white/5 border border-white/10 rounded-full px-3 py-1.5" }, t))),
      h("button", { onClick: onStart, className: "mt-9 accent-grad text-white font-semibold text-sm px-7 py-3.5 rounded-xl inline-flex items-center gap-2 accent-glow" }, "Start Verification ", h(Icon, { name: "ChevronRight", size: 16 })),
      h("p", { className: "text-slate-500 text-[11px] mt-5", style: mono }, "DEMO BUILD · mock verification logic · no live government database access"),
      h("div", { className: "mt-6 flex justify-center" }, h(SIHBadge, { size: "lg" }))
    )
  );

/* ---------------- App ---------------- */
function App() {
  const [entered, setEntered] = useState(false);
  const [view, setView] = useState("dashboard");
  const [selectedDocId, setSelectedDocId] = useState("aadhaar");
  const [history, setHistory] = useState([]);
  const [screeningRecords, setScreeningRecords] = useState(() => {
    try {
      const stored = JSON.parse(window.localStorage.getItem("zyid-record-screening") || "[]");
      const migrated = Array.isArray(stored) ? stored.map((record) => {
        const normalized = {
          ...record,
          crimeLikelihood: typeof record.crimeLikelihood === "number" ? record.crimeLikelihood : criminalLikelihoodFor(record.crimeMatch),
          crimeMatched: typeof record.crimeMatched === "boolean" ? record.crimeMatched : Boolean(record.crimeMatch && record.crimeMatch.record)
        };
        normalized.pdfDataUrl = createVerificationPdf(normalized);
        delete normalized.crimeMatch;
        return normalized;
      }) : [];
      window.localStorage.setItem("zyid-record-screening", JSON.stringify(migrated));
      return migrated;
    } catch (storageError) { return []; }
  });
  const [toast, setToast] = useState(null);
  const [themeMode, setThemeMode] = useState(() => {
    try { return window.localStorage.getItem("zyid-theme-mode") || "light"; } catch (storageError) { return "light"; }
  });
  const [statusTheme, setStatusTheme] = useState("neutral");
  const [language, setLanguage] = useState(readSavedLanguage);
  const [identityDocument, setIdentityDocument] = useState(null);
  const [scanPrefill, setScanPrefill] = useState(null);
  const [profile, setProfile] = useState(() => {
    try {
      return { fullName: "ZyID Operator", dob: "", email: "", phone: "", organization: "Demo Workspace", role: "Verification Analyst", address: "", note: "", ...JSON.parse(window.localStorage.getItem("zyid-profile") || "{}") };
    } catch (storageError) {
      return { fullName: "ZyID Operator", dob: "", email: "", phone: "", organization: "Demo Workspace", role: "Verification Analyst", address: "", note: "" };
    }
  });
  const toastTimer = useRef(null);

  useEffect(() => {
    applyStatusTheme(statusTheme);
    const st = STATUS_THEMES[statusTheme];
    if (st && st.c1) applyTheme({ c1: st.c1, c2: st.c2 });
    else applyTheme();
  }, [statusTheme]);
  useEffect(() => {
    document.documentElement.classList.toggle("zyid-dark", themeMode === "dark");
    document.body.classList.toggle("zyid-dark", themeMode === "dark");
    try { window.localStorage.setItem("zyid-theme-mode", themeMode); } catch (storageError) {}
  }, [themeMode]);

  const pushToast = (msg) => { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 2600); };
  const openIdentityCheck = (previewUrl, fileName, analysis) => {
    setIdentityDocument({ previewUrl, fileName, analysis });
    setView("identity");
    pushToast("Document photo loaded — live identity and demo database checks started");
  };
  const completeSmartScan = (selection) => {
    setSelectedDocId(selection.docId || "other");
    setScanPrefill(selection);
    const crimeMatch = selection.crimeMatch || analyzeCyberDocument(selection.docId || "other", selection.rawText || "", selection.fileName || "Smart Scan");
    setIdentityDocument({
      previewUrl: selection.photoUrl || selection.previewUrl,
      documentPreviewUrl: selection.previewUrl,
      fileName: selection.fileName,
      analysis: { rawText: selection.rawText || "" },
      crimeMatch
    });
    setView("verify");
    pushToast(crimeMatch.record
      ? `${docById(selection.docId || "other").name} detected — potential demo record match found`
      : `${docById(selection.docId || "other").name} detected — checking document fields`);
  };
  const onVerificationComplete = (result) => {
    setStatusTheme(result.status === "VERIFIED" ? "verified" : result.status === "FAILED" ? "invalid" : "neutral");
    const crimeMatch = result.crimeMatch || analyzeCyberDocument(result.docId || selectedDocId, result.rawText || "", result.sourceName || "Uploaded document");
    setIdentityDocument((current) => ({
      ...(current || {}),
      fileName: result.sourceName || (current && current.fileName) || "Uploaded document",
      analysis: { rawText: result.rawText || (current && current.analysis && current.analysis.rawText) || "" },
      crimeMatch
    }));
    const now = new Date();
    const caseId = "VR-" + Math.floor(2000 + Math.random() * 900);
    const identityCode = `ZID-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
    const createdAt = now.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    const entry = {
      date: now.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }),
      doc: docById(result.docId || selectedDocId).name,
      status: result.status,
      risk: result.risk.level,
      issues: result.issues.length ? result.issues[0].title.replace(/_/g, " ") : "None",
      caseId,
      identityCode,
      reportBatchId: result.reportBatchId || `SINGLE-${Date.now()}`,
      documentId: result.docId || selectedDocId,
      sourceName: result.sourceName || "Uploaded document",
      detected: result.detected || docById(result.docId || selectedDocId).name,
      headline: result.headline || "",
      confidence: result.confidence,
      issueList: result.issues || [],
      why: result.why || [],
      riskReasons: result.risk && result.risk.reasons ? result.risk.reasons : [],
      recommendation: result.recommendation || "",
      rawText: result.rawText || "",
      crimeMatch
    };
    setHistory((hh) => [entry, ...hh]);
    const screeningRecord = {
      identityCode,
      createdAt,
      document: entry.doc,
      sourceName: entry.sourceName,
      status: entry.status,
      risk: entry.risk,
      caseId,
      crimeMatch,
      crimeLikelihood: criminalLikelihoodFor(crimeMatch),
      crimeMatched: Boolean(crimeMatch.record),
      specialRemark: "COPY PROHIBITED · AUTHORIZED REVIEW ONLY · LOCAL DEMO RECORD"
    };
    screeningRecord.pdfDataUrl = createVerificationPdf(screeningRecord);
    delete screeningRecord.crimeMatch;
    setScreeningRecords((records) => {
      const next = [screeningRecord, ...records.filter((record) => record.identityCode !== identityCode)].slice(0, 25);
      try { window.localStorage.setItem("zyid-record-screening", JSON.stringify(next)); } catch (storageError) {}
      return next;
    });
   pushToast(`Verification saved as PDF ${identityCode} · risk signal updated`);
  };

  if (!entered) return h(Landing, { onStart: () => setEntered(true) });

  const titles = {
    dashboard: ["Dashboard", "AI identity & document screening overview"],
    smartscan: ["Smart Scan", "Auto-detect document types across uploads, PDFs, and camera captures"],
    verify: ["Verify Document", "Upload a document to run mock verification checks"],
    identity: ["Identity Check", "Verify face against document"],
    cybercrime: ["Record Screening", "Stored verification PDFs and demo record review"],
    cyberintel: ["Cyber Intelligence", "Identity correlation and criminal-record intelligence"],
    digilocker: ["Integrations", "Connect DigiLocker and external verification sources"],
    history: ["Verification History", "All verification attempts in this session"],
    reports: ["Reports", "Generate a demo verification report"],
    settings: ["Settings", "Appearance, privacy & security posture (demo)"]
  };

  return h("div", { className: "min-h-screen bg-[#05060a]" },
    h(EnergyBackground, { variant: "app" }),
    h("div", { className: "flex relative z-10" },
      h(Sidebar, { view, setView }),
      h("div", { className: "flex-1 min-w-0" },
         h(TopBar, { title: titles[view][0], sub: titles[view][1], language, setLanguage, setView, profile, pushToast }),
        h(MobileNav, { view, setView }),
        h("div", { key: view, className: "fade-in" },
          view === "dashboard" && h(Dashboard, { setView, setSelectedDoc: setSelectedDocId, history }),
          view === "smartscan" && h(SmartScanPage, { pushToast, onUseForIdentity: openIdentityCheck, onScanComplete: completeSmartScan }),
          view === "verify" && h(VerifyPage, { selectedDocId, setSelectedDocId, onComplete: onVerificationComplete, pushToast, onReset: () => setStatusTheme("neutral"), onOpenIdentity: openIdentityCheck, initialScan: scanPrefill, onClearSmartScan: () => setScanPrefill(null) }),
          view === "identity" && h(IdentityCheck, { documentImage: identityDocument && identityDocument.previewUrl, documentTypeId: selectedDocId }),
          view === "cybercrime" && h(RecordScreeningSummary, { screeningRecords }),
          view === "cyberintel" && h(CyberIntelligence, { selectedDocId, identityDocument, pushToast, screeningRecords }),
          view === "digilocker" && h(DigiLocker, { pushToast }),
          view === "history" && h(HistoryTable, { history }),
          view === "reports" && h(Reports, { history: [...history, ...SEED_HISTORY], pushToast }),
          view === "settings" && h(SettingsPage, { themeMode, setThemeMode, pushToast })
        )
      )
    ),
    h(Toast, { toast })
  );
}
applyTheme();
applyStatusTheme("neutral");
ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
</script>
</body>
